services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-gateway:latest
    container_name: ai-gateway
    ports:
      - "${PORT:-8080}:8080"
    environment:
      CONFIG_PATH: /etc/ai-gateway/config.toml
      GATEWAY_DB_PATH: /data/gateway.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${CONFIG_PATH:-./config.example.toml}:/etc/ai-gateway/config.toml:ro
      - ai-gateway-data:/data
    restart: unless-stopped

volumes:
  ai-gateway-data:
